[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chesscom-driver"
version = "0.1.0"
description = "Play chess.com Engine bots from Python via Playwright."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.44",
    "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["chesscom_driver"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
