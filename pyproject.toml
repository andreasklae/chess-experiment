[project]
name = "chess-experiment"
version = "0.1.0"
description = "Chess experiment workspace — backend"
requires-python = ">=3.12"
# The workspace root depends on the backend member. This makes `uv sync`
# install everything as one venv at `experiments/chess/.venv/`.
dependencies = [
    "chess-experiment-backend",
]

[tool.uv.sources]
chess-experiment-backend = { workspace = true }

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
]
