[project]
name = "chess-experiment-backend"
version = "0.1.0"
description = "Phase 1 chess experiment backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-chess>=1.999",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "skill-agent",
    "chesscom-driver",
]

[tool.uv.sources]
skill-agent = { git = "https://github.com/andreasklae/skillful-agent", branch = "main" }
chesscom-driver = { workspace = true }

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
